# Self-contained stack for a fresh host (Oracle Free Tier, any VPS): the MCP
# server plus a Caddy that terminates TLS for it. Use the plain
# docker-compose.yml instead when the host already runs a reverse proxy.
#
#   1. put your domain in deploy/Caddyfile
#   2. cp .env.example .env and fill it in
#   3. docker compose -f deploy/docker-compose.oracle.yml up -d --build
services:
  mcp-garmin:
    build: ..
    image: mcp-garmin:latest
    container_name: mcp-garmin
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - mcp_garmin_data:/data

  caddy:
    image: caddy:2
    container_name: mcp-garmin-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mcp-garmin

volumes:
  mcp_garmin_data:
  caddy_data:
  caddy_config:
