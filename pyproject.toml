[project]
name = "garmin-mcp"
version = "0.1.0"
description = "Read-only MCP server for Garmin Connect: activities, health data and the original FIT files"
requires-python = ">=3.12"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    # Upper bounds are deliberate. The server image is rebuilt on every deploy,
    # so an open constraint means the next deploy installs whatever is newest.
    # mcp 2.0 already removed mcp.server.fastmcp once (that is why the sibling
    # project MyFITContainer is pinned to mcp<2); this one uses MCPServer from
    # mcp 2.x and should not silently ride into a 3.0.
    "mcp>=2.1,<3",
    "httpx>=0.27",
    "fitdecode>=0.10",
    "starlette>=0.40",
    "uvicorn[standard]>=0.32",
    # Multi-user HTTP mode: password hashes and encryption at rest for other
    # people's Garmin tokens. Not needed for the single-user stdio mode, but
    # not worth an extra install path either.
    "argon2-cffi>=23.1",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "fit-tool>=0.9.15",     # synthesises FIT files for the tests
]

[project.scripts]
garmin-mcp = "garmin_mcp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["garmin_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
